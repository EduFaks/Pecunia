server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (defense in depth; the app is self-hosted, same-origin)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # API → pecunia-api. Preserve the browser's Host so the API's Origin/Host
    # CSRF check still matches; forward the real client IP + scheme.
    #
    # Deliberately $http_host, not $host: nginx's $host variable strips the
    # port from the Host header (ngx_http_validate_host truncates at the
    # first ':'), while $http_host is the raw header verbatim. On a
    # non-default port (e.g. :8480) a browser's Origin netloc includes the
    # port, so forwarding $host would send "Host: localhost" upstream while
    # Origin says "http://localhost:8480" — check_origin's netloc comparison
    # (api/src/pecunia/api/auth.py) would then mismatch and reject every
    # credentialed request with 403 ORIGIN_MISMATCH. $http_host keeps them
    # in sync. Verified end-to-end: see Task 1 report.
    location /api/ {
        proxy_pass http://pecunia-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # SPA history fallback — every non-file route serves index.html.
    #
    # Deliberately `$uri /index.html`, not `$uri $uri/ /index.html`: the
    # `$uri/` directory-match clause is only useful for redirecting a bare
    # directory request to an index file inside it — never needed here,
    # since every real static asset is requested by its exact hashed
    # filename (`/assets/index-<hash>.js`), which `$uri` alone already
    # matches. Vite's build output directory is named `assets/`, which is
    # also this app's own React Router route (`/assets`, the Assets
    # screen) — with `$uri/` present, a direct hit or hard refresh on
    # `/assets` matches that literal directory and nginx 301-redirects to
    # `/assets/` instead of falling through to the SPA, so the screen never
    # loads on a fresh navigation (only reachable via in-app client-side
    # routing, which never round-trips through nginx). Dropping `$uri/`
    # removes the redirect step entirely, so `/assets` falls straight
    # through to `/index.html` like any other app route.
    location / {
        try_files $uri /index.html;
    }
}
